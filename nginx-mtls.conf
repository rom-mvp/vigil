# Nginx configuration for mTLS enforcement in front of Vigil Gateway
# This enforces mutual TLS with client certificate verification

upstream vigil_gateway {
    server vigil-gateway:8000;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name vigil.company.internal;
    return 301 https://$server_name$request_uri;
}

# HTTPS with mutual TLS
server {
    listen 443 ssl;
    server_name vigil.company.internal;

    # Server certificate (for clients to verify nginx)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Client CA for mutual TLS verification
    ssl_client_certificate /etc/nginx/certs/client-ca.crt;
    ssl_verify_client on;  # Enforce client cert
    ssl_verify_depth 2;

    # TLS hardening
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling for cert revocation checking
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/client-ca.crt;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Pass client cert DN to upstream Vigil (for audit logs)
    proxy_set_header X-Client-Cert $ssl_client_s_dn;
    proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
    proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    # Proxy all traffic to Vigil Gateway
    location / {
        # Reject if client cert verification failed
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_pass http://vigil_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Timeouts for long LLM responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint (no mTLS required)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
