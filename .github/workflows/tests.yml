name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast tests (unit/others)
        env:
          PYTHONPATH: src
        run: |
          pytest -q --ignore=tests/integration --ignore=tests/performance --ignore=tests/archived

      - name: Run fail-closed and Merkle audit integration tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/integration/test_fail_closed.py tests/integration/test_merkle_audit_chain.py -v --tb=short
