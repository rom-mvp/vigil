<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigil Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        body { background-color: #0b0c15; color: #ffffff; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Placeholder - Server replaces this with "" for local mode
        const API_BASE = "https://2mhtzu4ve4.execute-api.us-east-2.amazonaws.com/dev"; 

        function App() {
            const [key, setKey] = React.useState(localStorage.getItem('vigil_key') || '');
            const [loggedIn, setLoggedIn] = React.useState(!!localStorage.getItem('vigil_key'));
            const [data, setData] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            React.useEffect(() => {
                if (loggedIn) fetchData();
                const interval = setInterval(() => { if(loggedIn) fetchData() }, 2000);
                return () => clearInterval(interval);
            }, [loggedIn]);

            const fetchData = async () => {
                try {
                    const res = await fetch(`${API_BASE}/admin/dashboard`, { headers: { 'x-agentshield-key': key } });
                    if (res.ok) setData(await res.json());
                } catch (e) { console.error(e); }
            };

            const login = (e) => {
                e.preventDefault();
                setLoading(true);
                localStorage.setItem('vigil_key', key);
                fetch(`${API_BASE}/admin/dashboard`, { headers: { 'x-agentshield-key': key } })
                    .then(res => {
                        if (res.ok) { setLoggedIn(true); return res.json(); }
                        else { alert("Invalid Key"); localStorage.removeItem('vigil_key'); setLoading(false); }
                    })
                    .then(json => { if(json) setData(json); setLoading(false); })
                    .catch((err) => { console.error(err); setLoading(false); });
            };

            if (!loggedIn) {
                return (
                    <div className="h-screen flex items-center justify-center bg-black">
                        <div className="glass p-8 rounded-xl w-96 text-center border border-white/20">
                            <h1 className="text-3xl font-bold text-white mb-4 tracking-tight">VIGIL</h1>
                            <p className="text-gray-400 text-sm mb-6">Local Enterprise Console</p>
                            <form onSubmit={login}>
                                <input type="text" placeholder="Enter 'sk_admin'" value={key} onChange={e => setKey(e.target.value)}
                                    className="w-full bg-white/10 border border-white/20 rounded p-3 mb-4 text-white outline-none focus:border-white" />
                                <button disabled={loading} className="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-500 transition">{loading ? "Connecting..." : "Access Dashboard"}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (!data) return <div className="p-10 text-center text-gray-500">Loading Enterprise Data...</div>;
            return (
                <div className="min-h-screen p-8 max-w-6xl mx-auto font-mono text-sm">
                    <header className="flex justify-between items-center mb-12 border-b border-white/10 pb-6">
                        <div><h1 className="text-2xl font-bold tracking-tight text-white">COMMAND CENTER</h1><div className="text-xs text-gray-500 mt-1">LOCAL FLEET • STATUS: ONLINE</div></div>
                        <button onClick={() => {localStorage.clear(); setLoggedIn(false); setData(null);}} className="text-xs text-gray-500 hover:text-white uppercase">Disconnect</button>
                    </header>
                    <div className="grid grid-cols-4 gap-6 mb-12">
                        <div className="glass p-6 rounded-lg"><div className="text-gray-500 text-xs uppercase mb-2">Requests</div><div className="text-3xl font-bold text-white">{data.stats.total_requests}</div></div>
                        <div className="glass p-6 rounded-lg border-t-2 border-red-500"><div className="text-red-400 text-xs uppercase mb-2">Blocked</div><div className="text-3xl font-bold text-red-500">{data.stats.blocked_attacks}</div></div>
                        <div className="glass p-6 rounded-lg border-t-2 border-blue-500"><div className="text-blue-400 text-xs uppercase mb-2">Redacted</div><div className="text-3xl font-bold text-blue-500">{data.stats.redacted_events}</div></div>
                    </div>
                    <div className="glass rounded-lg overflow-hidden">
                        <div className="p-4 border-b border-white/10 bg-white/5 flex justify-between items-center"><span className="font-bold uppercase text-gray-400">Logs</span><span className="text-green-500 text-xs animate-pulse">● Live</span></div>
                        <table className="w-full text-left"><thead className="text-gray-500 border-b border-white/5"><tr><th className="p-4">Time</th><th className="p-4">Status</th><th className="p-4">Agent ID</th><th className="p-4">Details</th></tr></thead>
                            <tbody className="divide-y divide-white/5">
                                {data.recent_logs.map((log, i) => (
                                    <tr key={i} className="hover:bg-white/5 transition">
                                        <td className="p-4 text-gray-500">{new Date(log.timestamp).toLocaleTimeString()}</td>
                                        <td className="p-4"><span className={`px-2 py-1 rounded text-xs border ${log.status.includes('BLOCKED') ? 'border-red-500 text-red-400' : 'border-green-500 text-green-400'}`}>{log.status}</span></td>
                                        <td className="p-4 text-gray-300">{log.agent_id}</td>
                                        <td className="p-4 text-gray-400">{log.status.includes('BLOCKED') ? <span className="text-red-400">{log.details.reason}</span> : (log.details.redacted ? <span className="text-blue-400">🔒 Redacted</span> : "Clean")}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
