<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Vigil War Room</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-mono">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [logs, setLogs] = React.useState([]);
            const [stats, setStats] = React.useState({ blocked: 0, allowed: 0 });
            const API_URL = "http://localhost:8000/api/attack-logs";
            const API_KEY = "PUT_YOUR_KEY_HERE"; // replace in production

            // Poll the logs every 2 seconds
            React.useEffect(() => {
                const fetchLogs = async () => {
                    try {
                        const res = await fetch(API_URL, {
                            headers: { Authorization: `Bearer ${API_KEY}` }
                        });
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        const latest = (data.logs || []).slice(-10).reverse();
                        const normalized = latest.map(log => ({
                            time: new Date(log.timestamp || Date.now()).toLocaleTimeString(),
                            ip: log.session_id || "unknown",
                            payload: log.prompt || "",
                            action: log.blocked ? "BLOCK" : "ALLOW",
                            blocked: !!log.blocked
                        }));
                        setLogs(normalized);
                        const blockedCount = normalized.filter(l => l.blocked).length;
                        setStats({
                            blocked: blockedCount,
                            allowed: latest.length - blockedCount
                        });
                    } catch (err) {
                        console.warn("Live fetch failed, keeping existing logs", err);
                    }
                };

                fetchLogs();
                const interval = setInterval(fetchLogs, 2000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="p-10 max-w-6xl mx-auto">
                    <h1 className="text-4xl font-bold mb-8 text-red-500">🔭 VIGIL WAR ROOM</h1>
                    
                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-gray-800 p-6 rounded-lg border border-red-500">
                            <h2 className="text-xl text-gray-400">THREATS BLOCKED</h2>
                            <p className="text-6xl font-bold text-red-500">{stats.blocked}</p>
                        </div>
                        <div className="bg-gray-800 p-6 rounded-lg border border-green-500">
                            <h2 className="text-xl text-gray-400">SAFE REQUESTS</h2>
                            <p className="text-6xl font-bold text-green-500">{stats.allowed}</p>
                        </div>
                    </div>

                    <div className="bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                        <table className="w-full text-left">
                            <thead className="bg-gray-700 text-gray-300">
                                <tr>
                                    <th className="p-3">TIME</th>
                                    <th className="p-3">SOURCE IP</th>
                                    <th className="p-3">PAYLOAD SNIPPET</th>
                                    <th className="p-3">DECISION</th>
                                </tr>
                            </thead>
                            <tbody>
                                {logs.map((log, i) => (
                                    <tr key={i} className="border-b border-gray-700 hover:bg-gray-750">
                                        <td className="p-3 text-gray-400">{log.time}</td>
                                        <td className="p-3 text-blue-400">{log.ip}</td>
                                        <td className="p-3 font-mono text-sm opacity-80">{log.payload}</td>
                                        <td className="p-3">
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${log.action === "BLOCK" ? "bg-red-900 text-red-200" : "bg-green-900 text-green-200"}`}>
                                                {log.action}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
