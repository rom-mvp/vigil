version: '3.8'

services:
  # AgentShield Backend (Real or Mock)
  # To use REAL AgentShield:
  #   1. Ensure services/agentshield is cloned or symlinked
  #   2. Change context to: ./services/agentshield
  #   3. Change dockerfile to: Dockerfile or Dockerfile.prod
  #   4. Add environment vars for HARDWARE_BACKEND, DATABASE_URL, etc.
  agentshield:
    build:
      context: ./services/agentshield      # FIXED: Points to real AgentShield repo
      dockerfile: Dockerfile.prod          # FIXED: Use production Dockerfile
    container_name: vigil-agentshield
    ports:
      - "9000:9000"
    environment:
      # FIXED: Using real AgentShield environment (mock references removed)
      - APP_ENV=prod
      - HARDWARE_BACKEND=aws_nitro         # Enable AWS Nitro attestation verification
      - AWS_REGION=us-east-1
      - PORT=9000
      
      # Database configuration (for real backend)
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentshield
      
      # Security configuration
      - AGENTSHIELD_SIGNING_KEY_B64=${AGENTSHIELD_SIGNING_KEY_B64:-}
      - REQUIRE_ATTESTATION=false          # Set to true on Nitro/TDX hosts
    networks:
      - vigil-network
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - agentshield-keys:/app/keys
      - agentshield-logs:/app/logs

  # Vigil security gateway
  vigil:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vigil-gateway
    user: "1000:1000"
    command: ["./start.sh"]
    ports:
      - "8000:8000"
    environment:
      # AgentShield Integration (works with both mock and real)
      - AGENTSHIELD_API_URL=http://agentshield:9000
      - AGENTSHIELD_JWKS_URL=http://agentshield:9000/.well-known/jwks.json
      - AGENTSHIELD_REQUIRE_SIGNED=true
      - AGENTSHIELD_TIMEOUT_MS=5000
      - AGENTSHIELD_API_KEY=                          # Optional, for real backend auth
      
      # Semantic caching config
      - AGENTSHIELD_CACHE_TTL_SECONDS=300
      - AGENTSHIELD_CACHE_SIM_THRESHOLD=0.92
      
      # For Nitro/TDX hosts with vsock, override transport:
      - VIGIL_AGENTSHIELD_TRANSPORT=${VIGIL_AGENTSHIELD_TRANSPORT:-http}
      - VIGIL_AGENTSHIELD_VSOCK_CID=${VIGIL_AGENTSHIELD_VSOCK_CID:-3}
      - VIGIL_AGENTSHIELD_VSOCK_PORT=${VIGIL_AGENTSHIELD_VSOCK_PORT:-5555}
      
      # Policy Configuration
      - MAX_RISK_SCORE=0.30
      - DISALLOWED_REASONS=credential-exfil,tenant-boundary,privilege-escalation
      
      # Freshness Validation
      - DECISION_MAX_AGE_SECONDS=300
      
      # Rate Limiting
      - RATE_LIMIT_RPS=100
      
      # Allow fallback when AgentShield is unavailable
      - AGENTSHIELD_REQUIRED=false
      
      # Logging
      - LOG_LEVEL=INFO
      - APPEND_LOG_PATH=/app/logs/vigil_audit.jsonl
      - DASHBOARD_ADMIN_TOKEN=${DASHBOARD_ADMIN_TOKEN:-local-dev-token}
    volumes:
      - vigil-logs:/app/logs
    networks:
      - vigil-network
    depends_on:
      agentshield:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Vigil Dashboard (Audit & Monitoring UI)
  vigil-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: vigil-dashboard
    ports:
      - "300:3000"
    environment:
      - DASHBOARD_SECRET_KEY=change-me-in-production
      - DASHBOARD_ADMIN_TOKEN=local-dev-token
      - VIGIL_GATEWAY_URL=http://vigil:8000
      - APPEND_LOG_PATH=/app/logs/vigil_audit.jsonl
    volumes:
      - vigil-logs:/app/logs:ro
    networks:
      - vigil-network
    depends_on:
      - vigil
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Redis cache (required for real AgentShield)
  redis:
    image: redis:7-alpine
    container_name: vigil-redis
    ports:
      - "6379:6379"
    networks:
      - vigil-network
    restart: unless-stopped

  # PostgreSQL database (required for real AgentShield)
  postgres:
    image: postgres:15
    container_name: vigil-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=agentshield
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vigil-network
    restart: unless-stopped

volumes:
  vigil-logs:
    driver: local
  postgres_data:
    driver: local
  agentshield-keys:
    driver: local
  agentshield-logs:
    driver: local

networks:
  vigil-network:
    driver: bridge
