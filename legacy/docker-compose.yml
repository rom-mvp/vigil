version: '3.8'
services:
  vigil-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "5000:5000"
    environment:
      - VIGIL_MODE=local
      - VIGIL_REQUIRE_AUTH=false
    volumes:
      - ./api_keys.json:/app/api_keys.json:ro
    networks:
      - vigil-net
  vigil-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VIGIL_MODE=local
      - MAX_REQUEST_BYTES=1048576
      - RATE_LIMIT_RPS=5
      - REQUIRE_MTLS=false
    networks:
      - vigil-net
networks:
  vigil-net:
