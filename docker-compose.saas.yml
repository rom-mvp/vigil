version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # 1. VIGIL GATEWAY - The "Dumb" Forwarder (Public-Facing)
  # ═══════════════════════════════════════════════════════════
  vigil-gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vigil-gateway
    ports:
      - "8000:8000"  # Public API
    environment:
      # Environment
      - VIGIL_ENV=docker
      - VIGIL_STRICT_MODE=true
      - VIGIL_MODE=saas
        - AGENTSHIELD_URL=http://agentshield-enclave:8443
        - AGENTSHIELD_JWKS_URL=http://agentshield-enclave:8443/.well-known/jwks.json
      - AGENTSHIELD_FAIL_MODE=deny
      
      # Enclave Connection (Docker DNS resolves 'agentshield-enclave')
      - ENCLAVE_URL=http://agentshield-enclave:8443
      
      # JWT Auth (Mock for local dev)
      - AUTH_JWKS_URL=https://auth.vigil.ai/.well-known/jwks.json
      - AUTH_ISSUER=https://auth.vigil.ai
      - AUTH_AUDIENCE=vigil-api
      
      # Logging
      - LOG_LEVEL=info
      
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT="6379"
    
    depends_on:
      - agentshield-enclave
      - redis
    
    networks:
      - secure-mesh
    
    volumes:
      # Mount shared schemas so they're accessible
      - ./shared:/app/shared:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # 2. AGENTSHIELD ENCLAVE - The "Smart" Vault (Backend Only)
  # ═══════════════════════════════════════════════════════════
  agentshield-enclave:
    build:
        context: ../agentshield
        dockerfile: core/Dockerfile
    container_name: agentshield-enclave
      command: ["./entrypoint.sh"]
      environment:
        AGENT_SIGNING_KEY: dev_key
        REDIS_URL: redis://redis:6379/1
        LOG_LEVEL: info
    ports:
        - "8443:8443"
      depends_on:
        redis:
          condition: service_started
    networks:
      - secure-mesh
    
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # 3. REDIS - Policy Cache & Rate Limiting
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: vigil-redis
    ports:
      - "6379:6379"
    networks:
      - secure-mesh
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

# ═══════════════════════════════════════════════════════════
# Networks: Isolated mesh for service-to-service communication
# ═══════════════════════════════════════════════════════════
networks:
  secure-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ═══════════════════════════════════════════════════════════
# Volumes: Persistent storage
# ═══════════════════════════════════════════════════════════
volumes:
  redis-data:
    driver: local
