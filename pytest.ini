[pytest]
# Pytest Configuration for Vigil Test Suite

# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test Paths
testpaths = tests

# Minimum Python Version
minversion = 3.10

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --code-highlight=yes
    -ra
    --disable-warnings

# Markers for Test Organization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require services)
    performance: Performance and load tests
    security: Security and red team tests
    slow: Tests that take >5 seconds
    
# Coverage Options (optional, requires pytest-cov)
# addopts = --cov=src/vigil --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_run.log
log_file_level = DEBUG

# Timeout (requires pytest-timeout)
# timeout = 300

# Parallel Execution (requires pytest-xdist)
# addopts = -n auto
