version: '3.8'

services:
  vigil:
    build: .
    container_name: vigil-gateway
    ports:
      - "8000:8000"
    environment:
      - VIGIL_STRICT_MODE=false
      - VIGIL_ENV=docker
      - REDIS_URL=redis://vigil-redis:6379/0
      - VIGIL_PLAINTEXT_MODE=migration
      - AGENTSHIELD_URL=http://vigil-agentshield:9000
      - AGENTSHIELD_JWKS_URL=http://vigil-agentshield:9000/.well-known/jwks.json
      - VIGIL_BYPASS_AGENTSHIELD=true
      - PYTHONPATH=/app/src
      - VIGIL_REDIS_HOST=vigil-redis
      - VIGIL_REDIS_PORT=6379
    volumes:
      - .:/app
    working_dir: /app
    command: ["./start.sh"]
    networks:
      - vigil-network
    depends_on:
      vigil-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  vigil-redis:
    image: redis:alpine
    container_name: vigil-redis
    ports:
      - "6379:6379"
    networks:
      - vigil-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vigil-network:
    driver: bridge
