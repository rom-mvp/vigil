version: '3.8'

services:
  # AgentShield decision service (external dependency)
  agentshield:
    image: agentshield:latest
    container_name: agentshield
    ports:
      - "8000:8000"
    environment:
      - SIGNING_KEY_PATH=/keys/signing.key
      - PORT=8000
    volumes:
      - ./keys:/keys:ro
    networks:
      - vigil-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for state (rate limits, sessions)
  redis:
    image: redis:alpine
    container_name: vigil-redis
    ports:
      - "6379:6379"
    networks:
      - vigil-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Postgres for audit logs
  db:
    image: postgres:15-alpine
    container_name: vigil-db
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_password
      POSTGRES_DB: vigil_audit
    volumes:
      - vigil-db-data:/var/lib/postgresql/data
    networks:
      - vigil-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vigil security gateway
  vigil:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vigil-gateway
    ports:
      - "8080:8000"
    environment:
      # AgentShield Integration
      - AGENTSHIELD_URL=http://agentshield:8000
      - AGENTSHIELD_JWKS_URL=http://agentshield:8000/v1/keys/jwks
      - AGENTSHIELD_REQUIRE_SIGNED=true
      - AGENTSHIELD_TIMEOUT_MS=3000
      
      # Policy Configuration
      - MAX_RISK_SCORE=0.30
      - DISALLOWED_REASONS=credential-exfil,tenant-boundary,privilege-escalation
      
      # Freshness Validation
      - DECISION_MAX_AGE_SECONDS=300
      
      # Rate Limiting
      - RATE_LIMIT_RPS=5
      - REDIS_URL=redis://redis:6379/0
      
      # Persistence
      - DATABASE_URL=postgresql://vigil:vigil_password@db:5432/vigil_audit
      
      # Optional: Local Fallback
      - AGENTSHIELD_REQUIRED=true
      - BREAK_GLASS_ENABLED=false
      
      # Logging
      - LOG_LEVEL=INFO
      - APPEND_LOG_PATH=/app/logs/vigil_audit.jsonl
      - LOG_SERVER_URL=http://vigil-dashboard:3000/api/v1/audit/ingest
    depends_on:
      agentshield:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - vigil-logs:/app/logs
    networks:
      - vigil-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Vigil Dashboard (Audit UI)
  vigil-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: vigil-dashboard
    ports:
      # Expose dashboard on host port 300 (system expectation)
      - "300:3000"
    environment:
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-changeme-in-production}
      - DASHBOARD_ADMIN_TOKEN=${DASHBOARD_ADMIN_TOKEN:-local-dev-token}
      # VIGIL_GATEWAY_URL used by backend to ping gateway? No, actually Dashboard is mostly frontend.
      # But if Dashboard Server needs to talk to Gateway, it uses internal Docker network.
      # Internal port is still 8000. External port mapped to host is 8080.
      # So VIGIL_GATEWAY_URL=http://vigil:8000 is correct for internal communication.
      # The frontend running in browser needs external URL.
      # We should inject VITE_VIGIL_URL into the build.
      
      - VIGIL_GATEWAY_URL=http://vigil:8000
      - APPEND_LOG_PATH=/app/logs/vigil_audit.jsonl
      - DATABASE_URL=postgresql://vigil:vigil_password@db:5432/vigil_audit
    volumes:
      - vigil-logs:/app/logs:ro  # Read-only access to audit logs
    networks:
      - vigil-network
    depends_on:
      - vigil
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  vigil-logs:
    driver: local
  vigil-db-data:
    driver: local

networks:
  vigil-network:
    driver: bridge
